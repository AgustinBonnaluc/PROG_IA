<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planificación de cortes</title>
    <style>
        :root {
            --tinta: #1e293b;
            --gris: #64748b;
            --linea: #e2e8f0;
            --acento: #0f766e;
            --alerta: #b91c1c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 28px;
            background: #f4f6f8;
            color: var(--tinta);
        }

        h1 {
            font-size: 22px;
            margin: 0 0 4px;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 14px;
        }

        .sub {
            color: var(--gris);
            font-size: 13px;
            margin: 0 0 22px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
            margin-bottom: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--linea);
        }

        th {
            background: #f8fafc;
            color: var(--gris);
            font-weight: 600;
        }

        .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: #e2e8f0;
            color: #475569;
        }

        .tag.pendiente {
            background: #fef3c7;
            color: #92400e;
        }

        .tag.planificada {
            background: #ccfbf1;
            color: #115e59;
        }

        .urgente {
            color: var(--alerta);
            font-weight: 600;
        }

        .metricas {
            display: flex;
            flex-wrap: wrap;
        }

        .metrica {
            margin-right: 34px;
        }

        .metrica .valor {
            font-size: 24px;
            font-weight: 600;
        }

        .metrica .rotulo {
            font-size: 12px;
            color: var(--gris);
        }

        .barra {
            display: flex;
            height: 30px;
            border: 1px solid var(--linea);
            border-radius: 4px;
            overflow: hidden;
            background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 5px, #e2e8f0 5px, #e2e8f0 10px);
            margin: 4px 0 10px;
        }

        .pieza {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            border-right: 2px solid #fff;
            overflow: hidden;
            white-space: nowrap;
        }

        .barra-rotulo {
            font-size: 12px;
            color: var(--gris);
            display: flex;
            justify-content: space-between;
        }

        .aviso {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            padding: 12px 14px;
            font-size: 13px;
            color: #92400e;
        }

        details summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--acento);
        }

        .leyenda {
            display: flex;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--gris);
            margin-bottom: 14px;
        }

        .leyenda span {
            margin-right: 16px;
        }

        .muestra {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <h1>Planificación de cortes</h1>
    <p class="sub">Panel de solo lectura sobre la base en Supabase. El plan lo genera el agente vía MCP.</p>

    <div class="card">
        <h2>Órdenes de trabajo</h2>
        <div id="ordenes">Cargando…</div>
    </div>

    <div class="card">
        <h2>Plan de corte</h2>
        <div id="planes">Cargando…</div>
    </div>

    <script>
        const COLORES = ["#0f766e", "#1d4ed8", "#7c3aed", "#b45309", "#be123c", "#0369a1", "#4d7c0f", "#a21caf"];
        const mm = n => Number(n).toLocaleString("es-AR") + " mm";

        // Cada OT tiene su color, así se ve de un vistazo que una misma barra
        // combina piezas de órdenes distintas: eso es lo que el método manual no hacía.
        const colorPorOt = {};
        const colorDe = ot => {
            if (!(ot in colorPorOt)) colorPorOt[ot] = COLORES[Object.keys(colorPorOt).length % COLORES.length];
            return colorPorOt[ot];
        };

        function plazo(dias, estado) {
            if (estado === "entregada") return "—";
            if (dias < 0) return `<span class="urgente">vencida</span>`;
            if (dias === 0) return `<span class="urgente">hoy</span>`;
            const texto = dias === 1 ? "1 día" : `${dias} días`;
            return `<span class="${dias <= 4 ? "urgente" : ""}">${texto}</span>`;
        }

        async function traer(ruta) {
            const r = await fetch(ruta);
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        function pintarOrdenes(ordenes) {
            const filas = ordenes.map(o => {
                const detalle = o.piezas_detalle.map(p =>
                    `<tr><td>${p.descripcion}</td><td>${p.material}</td>
                     <td class="num">${p.largo_mm} mm</td><td class="num">× ${p.cantidad}</td></tr>`).join("");
                return `<tr>
                    <td><strong>${o.codigo}</strong></td>
                    <td>${o.cliente}<br><span style="color:var(--gris)">${o.descripcion}</span></td>
                    <td><span class="tag ${o.estado}">${o.estado}</span></td>
                    <td class="num">${plazo(o.dias_restantes, o.estado)}</td>
                    <td class="num">${o.piezas}</td>
                    <td class="num">${mm(o.mm_requeridos)}</td>
                    <td><details><summary>Ver piezas</summary><table>${detalle}</table></details></td>
                </tr>`;
            }).join("");
            document.getElementById("ordenes").innerHTML = `<table>
                <tr><th>OT</th><th>Cliente</th><th>Estado</th><th class="num">Entrega</th>
                    <th class="num">Piezas</th><th class="num">Requerido</th><th></th></tr>${filas}</table>`;
        }

        function pintarPlanes(data) {
            const destino = document.getElementById("planes");
            if (!data.disponible || data.planes.length === 0) {
                destino.innerHTML = `<div class="aviso">Todavía no hay planes guardados.
                    El agente los genera al ejecutar la optimización a través de los servidores MCP.</div>`;
                return;
            }
            const num = v => Number(v) || 0;
            const totalBarras = data.planes.reduce((a, p) => a + num(p.barras_usadas), 0);
            const totalDesp = data.planes.reduce((a, p) => a + num(p.desperdicio_mm), 0);
            const totalLargo = data.planes.reduce((a, p) => a + num(p.barras_usadas) * num(p.largo_barra_mm), 0);
            const kgDesp = data.planes.reduce((a, p) => a + num(p.desperdicio_mm) / 1000 * num(p.kg_por_metro), 0);
            const resumen = `<div class="metricas" style="margin-bottom:22px">
                <div class="metrica"><div class="valor">${totalBarras}</div><div class="rotulo">barras de 6 m</div></div>
                <div class="metrica"><div class="valor">${(100 * (1 - totalDesp / totalLargo)).toFixed(1)} %</div><div class="rotulo">aprovechamiento</div></div>
                <div class="metrica"><div class="valor">${mm(totalDesp)}</div><div class="rotulo">desperdicio</div></div>
                <div class="metrica"><div class="valor">${kgDesp.toFixed(1)} kg</div><div class="rotulo">acero sobrante</div></div>
            </div>`;

            const bloques = data.planes.map(plan => {
                const optimo = plan.barras_usadas === plan.cota_inferior
                    ? `<span class="tag planificada">óptimo demostrado</span>` : "";
                const ots = [...new Set(plan.barras.flatMap(b => b.cortes.map(c => c.ot)))].sort();
                const leyenda = `<div class="leyenda">${ots.map(ot =>
                    `<span><i class="muestra" style="background:${colorDe(ot)}"></i>${ot}</span>`).join("")}</div>`;
                const barras = plan.barras.map(barra => {
                    const piezas = barra.cortes.map(c => {
                        const ancho = 100 * c.largo_mm / plan.largo_barra_mm;
                        const texto = ancho > 7 ? `${c.largo_mm}` : "";
                        return `<div class="pieza" style="width:${ancho}%;background:${colorDe(c.ot)}"
                                     title="${c.ot} · ${c.descripcion} · ${c.largo_mm} mm">${texto}</div>`;
                    }).join("");
                    const sobra = plan.largo_barra_mm - barra.ocupado_mm;
                    return `<div class="barra-rotulo"><span>Barra ${barra.nro} · ${barra.cortes.length} cortes</span>
                                <span>sobra ${mm(sobra)}</span></div>
                            <div class="barra">${piezas}</div>`;
                }).join("");
                return `<div style="margin-bottom:22px">
                    <h2 style="margin-bottom:8px">${plan.material} ${optimo}</h2>
                    <p class="sub" style="margin:0 0 10px">${plan.barras_usadas} barras ·
                       ${plan.aprovechamiento_pct}% de aprovechamiento · cota inferior ${plan.cota_inferior}</p>
                    ${leyenda}${barras}</div>`;
            }).join("");

            destino.innerHTML = resumen + bloques;
        }

        (async () => {
            try {
                pintarOrdenes(await traer("/api/ordenes"));
                pintarPlanes(await traer("/api/planes"));
            } catch (e) {
                document.body.insertAdjacentHTML("afterbegin",
                    `<div class="card aviso">No se pudo leer la base: ${e.message}</div>`);
            }
        })();
    </script>
</body>

</html>
